# Headers for the web app's own files. (API responses carry the API's headers, see the backend.)
# `always` adds them to error responses too.

# MUI/Emotion inject <style> tags at runtime, hence 'unsafe-inline' for styles only; scripts must
# come from this site. blob: covers file previews, camera frames and saved clips; data: the
# preview frames streamed while a video is processed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# The Live page uses the camera on this site only; nothing else needs device access.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
