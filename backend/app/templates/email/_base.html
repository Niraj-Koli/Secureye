<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f2f2f2;font-family:Montserrat,Arial,sans-serif;color:#111;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0"
                 style="max-width:560px;background:#fff;border-radius:8px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 24px;font-size:22px;">Secureye</h1>
                {% block content %}{% endblock %}
                <p style="margin:32px 0 0;font-size:12px;color:#666;">
                  You received this email because of activity on your Secureye account.
                  If this wasn't you, you can ignore this message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
